<script>
const $=s=>document.querySelector(s),T0=52140,SEED=1337,N={A:'ROUTE A',B:'ROUTE B',HOLD:'HOLD POSITION',RETASK:'RETASK UAV',STATUS:'REQUEST STATUS'};
const f=t=>{t+=T0;return[t/3600%24|0,t/60%60|0,t%60].map(x=>('0'+x).slice(-2)).join(':')},mm=s=>('0'+(s/60|0)).slice(-2)+':'+('0'+s%60).slice(-2);
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const GL={DDIL:'Communication that is denied, disconnected, degraded or intermittent.',AGE:'How long ago the reported observation was actually made.',GT:'What is actually happening inside the simulation.',GAP:'Important information that existed but did not reach the trainee.',JR:"Difference between the trainee's action and the best modeled action using information available at that time.",IR:'Impact of information that was unavailable when the decision was made.'};
const tip=(k,l)=>`<span class="tip" data-t="${GL[k]}">${l}</span>`,kv=(a,b,c='')=>`<div class="kv"><span>${a}</span><b class="${c}">${b}</b></div>`,nm=x=>x=='VESSEL'?'MARITIME VESSEL':x,ac=a=>a<60?'fresh':a<120?'aging':'stale',stc=s=>s=='good'?'g':s=='degraded'?'a':'r';
const P={HQ:[70,110],RELAY:[210,190],UAV:[350,105],VESSEL:[455,185]};
const LK={'HQ-RELAY':['HQ','RELAY'],'RELAY-CONVOY':['RELAY','CONVOY'],'UAV-RELAY':['UAV','RELAY'],'VESSEL-RELAY':['VESSEL','RELAY']};
const RT={A:[[200,300],[300,296],[380,288],[460,270],[540,250]],B:[[200,300],[250,335],[340,347],[450,337],[510,302],[540,250]]};
const U={A:{C:100,B:34},B:{C:70,B:70},HOLD:{C:45,B:45},RETASK:{C:50,B:50},STATUS:{C:55,B:55}};
const OUT={A:'DELAYED — CONVOY HALTED ON ROUTE A',B:'CONVOY ARRIVED VIA ROUTE B',HOLD:'DELAYED — CONVOY HELD',RETASK:'DELAYED — CONVOY HELD',STATUS:'DELAYED — CONVOY HELD'};
const EN={HQ:['HQ','COMMAND CENTRE'],RELAY:['RELAY-01','CENTRAL RIDGE','HQ-RELAY','RELAY'],UAV:['UAV-01','NORTH SECTOR','UAV-RELAY','UAV'],CONVOY:['CONVOY-01','','RELAY-CONVOY','CONVOY'],VESSEL:['VESSEL-01','COASTAL WATERS','VESSEL-RELAY','VESSEL']};
const S={pg:'dash',t:0,run:0,dec:null,ev:null,done:0,END:180,f:{a:null,c:85,p:70,fr:null,cm:null},sel:null,om:null,rt:0,rm:'trainee',rp:0,sn:new Set(),fk:'',dp:''};
function at(p,fr){const L=[];let tot=0;for(let i=1;i<p.length;i++){const d=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);L.push(d);tot+=d}let d=fr*tot;for(let i=0;i<L.length;i++){if(d<=L[i]||i==L.length-1){const k=Math.min(1,d/L[i]);return[p[i][0]+(p[i+1][0]-p[i][0])*k,p[i][1]+(p[i+1][1]-p[i][1])*k]}d-=L[i]}}
/* ---------- deterministic scenario + event log ---------- */
function build(dec){const r=rng(SEED),e=[],E=(t,k,d={})=>e.push({t,k,...d}),j=()=>2+Math.floor(r()*3);
E(0,'MISSION_STARTED',{seed:SEED});
E(10,'MESSAGE_GENERATED',{id:'m0',src:'RELAY',tx:'RELAY LINKS NOMINAL',c:99,o:10,l:'HQ-RELAY'});E(10+j(),'MESSAGE_DELIVERED',{id:'m0'});
E(24,'MESSAGE_GENERATED',{id:'m00',src:'CONVOY',tx:'CONVOY STAGED AT CHECKPOINT',c:97,o:24,l:'RELAY-CONVOY'});E(24+j(),'MESSAGE_DELIVERED',{id:'m00'});
E(38,'MESSAGE_GENERATED',{id:'m1',src:'UAV',tx:'ROUTE A APPEARS CLEAR',c:95,o:38,l:'UAV-RELAY'});E(42,'MESSAGE_DELIVERED',{id:'m1'});
E(70,'LINK_DEGRADED',{l:'UAV-RELAY'});E(80,'WORLD_STATE_CHANGED',{r:'A',s:'BLOCKED'});
E(110,'MESSAGE_GENERATED',{id:'m2',src:'UAV',tx:'ROUTE A BLOCKAGE DETECTED',c:90,o:110,l:'UAV-RELAY'});E(112,'MESSAGE_LOST',{id:'m2',l:'UAV-RELAY'});
E(112,'MESSAGE_GENERATED',{id:'m3',src:'VESSEL',tx:'POSSIBLE OBSTRUCTION NEAR ROUTE A',c:55,o:112,l:'VESSEL-RELAY'});E(120,'MESSAGE_DELIVERED',{id:'m3'});
E(180,'PROBE_STARTED');
if(dec){const a=dec.a;E(183,'DECISION_MADE',{a,c:dec.c});E(184,'ORDER_ISSUED',{a});E(185,'ORDER_QUEUED');E(186,'ORDER_IN_TRANSIT');E(190,'ORDER_DELIVERED');E(192,'ORDER_EXECUTING');
let end=250;if(a=='A'){E(192,'CONVOY_MOVING',{r:'A'});E(234,'CONVOY_HALTED')}else if(a=='B'){E(192,'CONVOY_MOVING',{r:'B'});E(262,'CONVOY_ARRIVED');end=270}
E(193,'ACK_GENERATED');E(195,'ACK_IN_TRANSIT');E(196,'ACK_LOST');E(end,'MISSION_ENDED',{o:OUT[a]})}
return e.sort((x,y)=>x.t-y.t)}
function der(e,t){const s={t,w:{A:'CLEAR',B:'CLEAR'},L:{'HQ-RELAY':'good','RELAY-CONVOY':'good','UAV-RELAY':'good','VESSEL-RELAY':'good'},M:{},o:{},halt:0,rt:null,mv:0,arr:0,fin:0};
for(const x of e){if(x.t>t)break;const k=x.k;
if(k=='MESSAGE_GENERATED')s.M[x.id]={...x,st:'GENERATED'};else if(k=='MESSAGE_DELIVERED')Object.assign(s.M[x.id],{st:'DELIVERED',rcv:x.t});else if(k=='MESSAGE_LOST')s.M[x.id].st='LOST';
else if(k=='LINK_DEGRADED')s.L[x.l]='degraded';else if(k=='LINK_RECOVERED')s.L[x.l]='good';else if(k=='WORLD_STATE_CHANGED')s.w[x.r]=x.s;
else if(k=='CONVOY_MOVING'){s.rt=x.r;s.mv=x.t}else if(k=='CONVOY_HALTED')s.halt=1;else if(k=='CONVOY_ARRIVED')s.arr=1;else if(k=='MISSION_ENDED'){s.fin=1;s.out=x.o}else if(/^(ORDER|ACK)/.test(k))s.o[k]=x.t}
const fr=!s.rt?0:s.rt=='A'?Math.min(.55,(t-s.mv)/42*.55):Math.min(1,(t-s.mv)/70);s.cv=at(RT[s.rt||'A'],fr);return s}
const dl=s=>Object.values(s.M).filter(m=>m.st=='DELIVERED').sort((a,b)=>b.rcv-a.rcv);
/* ---------- assessment (expected utility, simplified) ---------- */
function assess(){const s=der(S.ev,183),m1=s.M.m1,a1=183-m1.o,a3=183-s.M.m3.o,lk=.1+.5*(1-Math.exp(-a1/120));
let pb=.12*lk/(.12*lk+.88*.95);pb=pb*.55/(pb*.55+(1-pb)*.15);
const A=Object.keys(U),eu={};A.forEach(a=>eu[a]=(1-pb)*U[a].C+pb*U[a].B);
const best=A.reduce((x,y)=>eu[y]>eu[x]?y:x),bt=A.reduce((x,y)=>U[y].B>U[x].B?y:x),a=S.dec.a;
return{pb,eu,best,bt,a,jr:eu[best]-eu[a],ir:U[bt].B-U[best].B,real:U[a].B,a1,a3,s,sup:a=='A'?(1-pb)*100:100}}
/* ---------- map ---------- */
const kA=s=>s.halt?['OBSTRUCTED','r']:s.M.m3&&s.M.m3.st=='DELIVERED'?['UNCERTAIN','a']:s.M.m1&&s.M.m1.st=='DELIVERED'?['REPORTED CLEAR','g']:['NO DATA','t'];
const pp=(n,s)=>n=='CONVOY'?s.cv:P[n];
function mapSVG(s,m){const T=m=='truth',C={g:'#3FB97F',a:'#E3A93B',r:'#E5534B',b:'#4A9EE0',t:'#5E707C'},ka=kA(s);
let h=`<svg viewBox="0 0 600 370"><defs><pattern id="gr" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#14232E" stroke-width=".6"/></pattern></defs><rect width="600" height="370" fill="url(#gr)"/><path d="M380 0H600V228L520 214L440 232L395 160Z" fill="#0B1C2B" stroke="#16304a"/><text x="500" y="30" class="lb" style="fill:#2d4a63">COASTAL WATERS</text>`;
for(const k of'AB'){const col=T?(s.w[k]=='BLOCKED'?C.r:C.g):(k=='A'?C[ka[1]]:C.t),p=RT[k],lp=p[2];
h+=`<polyline points="${p.join(' ')}" fill="none" stroke="${col}" stroke-width="2" stroke-dasharray="${T?0:'3 5'}" opacity=".75"/><text x="${lp[0]-34}" y="${lp[1]+(k=='A'?-12:20)}" class="lb" style="fill:${col}">ROUTE ${k} · ${T?s.w[k]:k=='A'?ka[0]:'NO REPORT'}</text>`}
if((T&&s.w.A=='BLOCKED')||s.halt){const b=at(RT.A,.55);h+=`<circle cx="${b[0]}" cy="${b[1]}" r="10" fill="#E5534B22" stroke="#E5534B"/><path d="M-4-4L4 4M4-4L-4 4" transform="translate(${b[0]},${b[1]})" stroke="#E5534B" stroke-width="2"/>`}
h+=`<circle cx="540" cy="250" r="8" fill="none" stroke="#E8EEF2"/><circle cx="540" cy="250" r="2" fill="#E8EEF2"/><text x="500" y="276" class="lb">DESTINATION · SETTLEMENT</text>`;
for(const[k,[a,b]]of Object.entries(LK)){const A=pp(a,s),B=pp(b,s),st=s.L[k],col=C[st=='good'?'g':st=='degraded'?'a':'r'],c=`x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}"`;
h+=`<line ${c} stroke="${col}" stroke-width="1.6" ${st=='degraded'?'class="dg"':st=='good'?'opacity=".55"':'stroke-dasharray="2 6" opacity=".6"'}/><line ${c} stroke="transparent" stroke-width="14" style="cursor:pointer" onpointerdown="pick('l','${k}')"/>`}
if(m=='comm')Object.values(s.M).filter(x=>x.st=='LOST').forEach(x=>{const[a,b]=LK[x.l],A=P[a],B=pp(b,s),mx=(A[0]+B[0])/2,my=(A[1]+B[1])/2;h+=`<circle cx="${mx}" cy="${my}" r="9" fill="#2a1413" stroke="#E5534B"/><text x="${mx+12}" y="${my+3}" class="lb" style="fill:#E5534B">✗ ${x.id.toUpperCase()} LOST</text>`});
const en=(id,x,y,sh,lab)=>`<g class="en" onpointerdown="pick('e','${id}')" transform="translate(${x},${y})"><circle r="16" fill="transparent"/>${sh}<text y="25" text-anchor="middle" class="lb">${lab}</text></g>`,dm='M0-9L9 0L0 9L-9 0Z';

return`<div class="pg">${ph('ANALYTICS','Metrics computed from the recorded event log of this run plus illustrative history.')}<div class="stats">${[['MISSIONS COMPLETED',13],['DECISIONS ANALYZED',37],['INFORMATION GAPS',17+(A.ir>0)],['AVERAGE INFORMATION AGE',mm(avg)],['COMMUNICATION AWARENESS',d.cm=='Yes'?'Flagged':d.cm=='Unsure'?'Unsure':'Not flagged'],['CONFIDENCE CALIBRATION',(cal>0?'+':'')+cal+' pts']].map(([a,b])=>`<div><small>${a}</small><b style="font-size:20px">${b}</b></div>`).join('')}</div>
<div class="g2"><div class="pn"><h3>INFORMATION FRESHNESS · AGE (s) AT DECISION</h3>${bars(g,Math.max(...g.map(x=>x.v)))}</div><div class="pn"><h3>COMMUNICATION RELIABILITY · DELIVERY RATE</h3>${bars(rel,100,'%')}</div><div class="pn"><h3>DECISION CONFIDENCE</h3>${bars([{l:'STATED',v:d.c},{l:'PROBE P(CLEAR)',v:d.p},{l:'MODEL',v:Math.round(A.sup)}],100,'%')}</div><div class="pn"><h3>DECISION OUTCOMES (INCL. HISTORY)</h3>${bars([{l:'ARRIVED',v:7+o('B'),c:'#3FB97F'},{l:'DELAYED',v:4+o('A'),c:'#E3A93B'},{l:'HELD',v:1+(['HOLD','RETASK','STATUS'].includes(A.a)?1:0),c:'#4A9EE0'}],12)}</div></div>
<div class="pn"><h3>OBSERVED PROCESS PATTERNS</h3>${PT.map(p=>`<div class="pt"><div>${p[0]}<small>${p[2]}</small></div><em class="chip ${p[1]?'a':''}">${p[1]?'OBSERVED':'NOT OBSERVED'}</em></div>`).join('')}<p class="t3" style="margin-top:10px;font-size:11px">Patterns describe recorded simulation events only; they make no claim about the trainee’s thinking.</p></div></div>`}};
const NAV=[['dash','Dashboard','◧'],['scen','Scenarios','▤'],['sim','Training','▶'],['aar','AAR','☰'],['replay','Replay','⟲'],['ana','Analytics','▥']];
function go(p){if(p=='sim'&&!S.ev)p='scen';S.pg=p;S.fk='';S.dp='';S.sel=null;if(p=='replay')S.rt=Math.min(S.rt,S.END);
$('#app').innerHTML=`<nav><b>PRAGYA</b>${NAV.map(n=>`<a class="${n[0]==p?'on':''}" onclick="go('${n[0]}')"><i>${n[2]}</i>${n[1]}</a>`).join('')}</nav><main class="${p=='sim'?'col':''}">${PG[p]()}</main>`;
if(p=='sim'){upd()}if(p=='replay'&&S.done)updR()}
/* ---------- replay ---------- */
const CE={MESSAGE_GENERATED:['◦','GENERATED → TRANSMITTED',''],MESSAGE_DELIVERED:['✓','DELIVERED','g'],MESSAGE_LOST:['✗','LOST','r'],LINK_DEGRADED:['⚠','LINK DEGRADED','a'],WORLD_STATE_CHANGED:['●','WORLD STATE CHANGED','r'],DECISION_MADE:['▶','DECISION MADE','bl'],ORDER_ISSUED:['▶','ORDER ISSUED',''],ORDER_DELIVERED:['✓','ORDER DELIVERED','g'],ACK_LOST:['✗','ACK LOST','r'],CONVOY_HALTED:['■','CONVOY HALTED','r'],CONVOY_ARRIVED:['■','CONVOY ARRIVED','g'],MISSION_ENDED:['■','MISSION ENDED','']};
function updR(){if(!$('#rmap'))return;const t=S.rt,s=der(S.ev,t),m=S.rm;$('#rclk').textContent=f(t);$('#rsl').value=t;$('#rp').textContent=S.rp?'PAUSE':'PLAY';
$('#rtabs').innerHTML=[['trainee','TRAINEE VIEW'],['truth','GROUND TRUTH'],['comm','COMMUNICATION']].map(([k,l])=>`<span class="${m==k?'on':''}" onclick="S.rm='${k}';updR()">${l}</span>`).join('');
$('#rmap').innerHTML=mapSVG(s,m);$('#rsel').innerHTML=selHTML(s,t);let h='';
if(m=='trainee')h=`<h3>INFORMATION THAT REACHED HQ</h3>`+(dl(s).map(x=>msgH(x,t,0)).join('')||'<p class="t3">Nothing received yet.</p>')+Object.entries(s.L).map(([k,v])=>kv(k.replace('-',' → '),v.toUpperCase(),stc(v))).join('');
else if(m=='truth')h=`<h3>${tip('GT','GROUND TRUTH')} · SIMULATION STATE</h3>${kv('ROUTE A',s.w.A,s.w.A=='BLOCKED'?'r':'g')}${kv('ROUTE B',s.w.B,'g')}${kv('UAV',t>=110?'DETECTED BLOCKAGE':'OBSERVING')}${kv('UAV UPDATE',t>=112?'TRANSMISSION FAILED':t>=110?'IN FLIGHT':'—',t>=112?'r':'')}${kv('CONVOY',s.halt?'HALTED':s.arr?'ARRIVED':s.rt?'MOVING · '+N[s.rt]:'STAGED')}${s.fin?kv('OUTCOME',s.out):''}`;
else h=`<h3>COMMUNICATION EVENTS</h3>`+S.ev.filter(x=>x.t<=t&&CE[x.k]).reverse().map(x=>{const c=CE[x.k],tx=x.tx||(S.ev.find(y=>y.id==x.id&&y.tx)||{}).tx||x.l||'';return`<div class="kv"><span class="${c[2]}">${c[0]} ${c[1]}</span><b style="font-weight:500">${f(x.t)}<br><small>${tx}</small></b></div>`}).join('');
$('#rside').innerHTML=h;ages(t)}
function rpl(){if(S.rt>=S.END)S.rt=0;S.rp=!S.rp;updR()}
function rs(d){const ts=[...new Set(S.ev.map(x=>x.t))].sort((a,b)=>a-b);S.rt=d>0?(ts.find(x=>x>S.rt)??S.END):([...ts].reverse().find(x=>x<S.rt)??0);S.rp=0;updR()}
go('dash');
</script></body></html>
